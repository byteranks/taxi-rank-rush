<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1b2028">
<meta name="description" content="Fill your taxi, dodge potholes, roadblocks and cows, and beat the clock in this endless minibus taxi game.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taxi Rush">
<meta property="og:title" content="Taxi Rank Rush">
<meta property="og:description" content="Fill your taxi. Dodge the chaos. Beat the clock.">
<meta property="og:image" content="https://byteranks.github.io/taxi-rank-rush/icon-512.png">
<title>Taxi Rank Rush</title>
<script>window.TRR_BACKEND='supabase'</script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}html,body{margin:0;height:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen portrait game. Compact HUD on top, road canvas fills the middle, four touch controls at the bottom. */
:root{
  --ink:#1b2028; --panel:#262d37; --panel-2:#323b47; --line:#f5c518; --chalk:#f1f3f6; --muted:#9aa6b4;
  --danger:#ff5d4d; --good:#4fd08a; --boost:#47bff2; --stop:#d9473a;
  --display:'Bungee','Impact',system-ui,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.game{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-block:10px}

.hud{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:6px 12px 6px 8px;font-variant-numeric:tabular-nums;font-size:.95rem}
.pill svg{width:18px;height:18px;flex:none}
.pill b{font-weight:700}
.pill small{color:var(--muted);font-size:.8rem}
.pill.ok b{color:var(--good)}
.pill.hot{background:var(--danger)}
.hud .spacer{flex:1}
.round{width:38px;height:38px;border-radius:50%;border:0;background:var(--panel);color:var(--chalk);cursor:pointer;display:grid;place-items:center;flex:none}
.round svg{width:16px;height:16px}

.route{display:flex;align-items:center;gap:8px;font-size:.72rem;color:var(--muted);min-width:0;font-variant-numeric:tabular-nums}
.route span{white-space:nowrap}
.route .bar{flex:1;height:6px;background:var(--panel);border-radius:3px;position:relative;min-width:40px}
.route .bar i{position:absolute;inset:0 auto 0 0;background:var(--line);border-radius:3px}

.stage{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;background:#474d56}
canvas{display:block}
#cv{width:100%;height:100%}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(15,18,23,.82);padding:6px 14px;border-radius:999px;
  font-weight:500;font-size:.88rem;white-space:nowrap;pointer-events:none;transition:opacity .25s}
.coach{position:absolute;left:10px;right:10px;top:10px;background:rgba(15,18,23,.88);border-radius:12px;padding:10px 14px;
  font-size:.95rem;line-height:1.4;text-align:center;pointer-events:none}
.coach small{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--line);margin-bottom:3px}

.controls{display:grid;grid-template-columns:1fr .95fr .95fr 1fr;gap:8px}
.controls.two{grid-template-columns:1fr 1fr}
.controls.two #bLeft,.controls.two #bRight{display:none}
.ctl{display:grid;place-items:center;border:0;border-radius:14px;height:58px;background:var(--panel);color:var(--chalk);cursor:pointer;touch-action:none;position:relative;overflow:hidden;font-family:var(--display);font-size:.9rem}
.ctl svg{width:26px;height:26px}
.ctl:active,.ctl.on{background:var(--panel-2)}
.ctl.stop{background:var(--stop);color:#fff}
.ctl.boost{background:var(--boost);color:var(--ink)}
.ctl.stop.on,.ctl.boost.on{filter:brightness(1.18)}
.ctl.boost i{position:absolute;left:0;bottom:0;height:5px;background:rgba(0,0,0,.35)}
.ctl:focus-visible,.btn:focus-visible,.round:focus-visible,.link:focus-visible{outline:3px solid var(--line);outline-offset:2px}

/* Screens */
.overlay{position:fixed;inset:0;background:var(--ink);display:flex;z-index:5;overflow:auto;
  padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:max(20px, env(safe-area-inset-right, 0px));padding-block:24px}
.overlay.dim{background:rgba(20,24,30,.9)}
.card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;margin:auto}
.logo{font-family:var(--display);font-weight:400;font-size:3.1rem;line-height:.92;color:var(--line);margin:0}
.logo span{display:block;color:var(--chalk);font-size:.5em;letter-spacing:.06em}
.tag{color:var(--muted);margin:0}
h2{font-family:var(--display);font-weight:400;font-size:1.6rem;line-height:1.1;margin:0;text-wrap:balance}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--line);margin:0}
.card p{margin:0;color:var(--muted);line-height:1.5}
.card p b{color:var(--chalk);font-weight:500}
.btn{font-family:var(--display);font-size:1.05rem;background:var(--line);color:var(--ink);border:0;border-radius:14px;padding:15px 18px;cursor:pointer;text-align:center}
.btn.alt{background:var(--panel);color:var(--chalk)}
.btn.danger{background:var(--stop);color:#fff}
.confirm-item{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:14px;padding:12px 14px}
.confirm-item canvas{width:40px;height:56px;flex:none}
.confirm-item div{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.confirm-item b{font-size:1rem}
.confirm-item span{color:var(--muted);font-size:.85rem}
.confirm-item span strong{color:var(--line);font-weight:700}
.btn small{display:block;font-family:var(--body);font-size:.78rem;opacity:.75;margin-top:2px}
.stack{display:flex;flex-direction:column;gap:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.link{background:none;border:0;color:var(--muted);font:500 .9rem var(--body);cursor:pointer;padding:8px;text-decoration:underline;text-underline-offset:3px}
.links{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.coins{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--panel);border-radius:999px;padding:6px 12px 6px 8px;font-variant-numeric:tabular-nums;font-weight:700}
.coins svg{width:18px;height:18px}
.hero{width:100%;max-width:100%;height:150px;border-radius:14px}

/* How to play */
.section{display:flex;flex-direction:column;gap:10px;border-top:1px solid #323b47;padding-top:14px}
.legend{display:grid;grid-template-columns:44px 1fr;gap:10px 12px;align-items:center}
.legend canvas{width:44px;height:44px;background:#474d56;border-radius:10px}
.legend .key{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:.62rem;background:var(--panel-2)}
.legend .key svg{width:20px;height:20px}
.legend .key.stop{background:var(--stop);color:#fff}
.legend .key.boost{background:var(--boost);color:var(--ink)}
.legend b{display:block;font-weight:500}
.legend span{color:var(--muted);font-size:.86rem;line-height:1.4}

/* Map select */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:var(--muted);font:500 .9rem var(--body);padding:9px 0;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--ink);font-weight:700}
.seg button:focus-visible{outline:2px solid var(--chalk)}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.map{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel);border:0;border-radius:14px;padding:0 0 12px;overflow:hidden;color:var(--chalk);cursor:pointer;font:400 .8rem var(--body)}
.map canvas{width:100%;height:84px}
.map b{font-family:var(--display);font-weight:400;font-size:1rem;padding:6px 12px 0}
.map span{color:var(--muted);padding:0 12px;line-height:1.35}
.map em{font-style:normal;color:var(--line);padding:2px 12px 0;font-variant-numeric:tabular-nums}
.map:focus-visible{outline:3px solid var(--line);outline-offset:2px}

/* High scores */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;border:0;background:var(--panel);color:var(--muted);font:500 .85rem var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--line);color:var(--ink);font-weight:700}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.board li{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;background:var(--panel);border-radius:10px;padding:9px 12px;font-variant-numeric:tabular-nums}
.board li .r{font-family:var(--display);color:var(--muted)}
.board li:nth-child(1) .r{color:var(--line)}
.board li .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.board li .n small{display:block;font-weight:400;color:var(--muted);font-size:.72rem}
.board li .k{color:var(--muted);font-size:.8rem}
.board li .s{font-weight:700;font-size:1.05rem}
.board li.me{outline:2px solid var(--line)}
.empty{background:var(--panel);border-radius:10px;padding:16px;color:var(--muted);text-align:center}
.nameform{display:flex;gap:8px}
.nameform input{flex:1;min-width:0;background:var(--panel);border:2px solid var(--panel-2);border-radius:12px;color:var(--chalk);font:500 1rem var(--body);padding:12px 14px}
.nameform input:focus{outline:none;border-color:var(--line)}
.nameform .btn{padding:12px 16px}
.result{display:flex;gap:18px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.result div{display:flex;flex-direction:column}
.result b{font-size:1.5rem}
.result span{font-size:.75rem;color:var(--muted)}
.earned{display:flex;align-items:center;gap:6px;color:var(--line);font-weight:700}
.earned svg{width:18px;height:18px}

/* Garage */
.ups{display:flex;flex-direction:column;gap:8px}
.up{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px}
.up>div{flex:1;min-width:0;font-size:.82rem;color:var(--muted);line-height:1.35}
.up>div b{display:block;color:var(--chalk);font-size:.95rem;font-weight:500}
.pips{display:flex;gap:4px;margin-top:5px}
.pips i{width:18px;height:5px;border-radius:3px;background:#46505c}
.pips i.on{background:var(--line)}
.buy{display:flex;align-items:center;gap:5px;font:700 .82rem var(--body);background:var(--line);color:var(--ink);border:0;border-radius:10px;padding:9px 11px;cursor:pointer;white-space:nowrap}
.buy svg{width:14px;height:14px}
.buy:disabled{background:#3a434f;color:var(--muted);cursor:default}
.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.skin{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel);color:var(--muted);border:2px solid transparent;border-radius:12px;padding:8px 4px;font:500 .74rem var(--body);cursor:pointer}
.skin b{color:var(--chalk);font-size:.82rem;font-weight:500}
.skin canvas{width:40px;height:56px}
.skin.eq{border-color:var(--line)}
.skin:disabled{opacity:.45;cursor:default}
.buy:focus-visible,.skin:focus-visible,.toggle:focus-visible,.tabs button:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.toggle{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border-radius:14px;padding:14px 18px;border:0;color:var(--chalk);font:500 .95rem var(--body);cursor:pointer}
.toggle em{font-style:normal;color:var(--line)}
.panel{background:var(--panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font:400 .72rem var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--line)}
.daily{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--chalk);cursor:pointer;font:400 .82rem var(--body)}
.daily>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.daily b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.daily span{color:var(--muted);line-height:1.35}
.daily em{font-style:normal;color:var(--line);font-weight:700;white-space:nowrap}
.daily:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.mission{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:.86rem}
.mission .mbar{grid-column:1/-1;height:5px;background:#3a434f;border-radius:3px;overflow:hidden}
.mission .mbar i{display:block;height:100%;background:var(--good)}
.mission .rw{display:flex;align-items:center;gap:4px;color:var(--line);font-weight:700;font-variant-numeric:tabular-nums}
.mission .rw svg{width:14px;height:14px}
.mission small{color:var(--muted);font-variant-numeric:tabular-nums}
.done-list{display:flex;flex-direction:column;gap:6px}
.done-list div{display:flex;justify-content:space-between;gap:10px;background:rgba(79,208,138,.12);color:var(--good);border-radius:10px;padding:8px 12px;font-size:.86rem}
.note{font-size:.82rem;color:var(--muted)}
.namebar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted)}
.namebar b{color:var(--chalk)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lvl{display:flex;flex-direction:column;align-items:flex-end;gap:4px;background:none;border:0;color:var(--chalk);cursor:pointer;font:500 .82rem var(--body);padding:4px}
.lvl b{font-weight:700}
.lvl i{display:block;width:110px;height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.lvl i span{display:block;height:100%;background:var(--good)}
.lvl:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quad .btn{position:relative;font-size:.95rem;padding:14px 10px}
.badge{position:absolute;top:-6px;right:-4px;background:var(--danger);color:#fff;font:700 .7rem var(--body);border-radius:999px;padding:2px 7px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statgrid div{background:var(--panel);border-radius:12px;padding:10px;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.statgrid b{font-size:1.15rem}
.statgrid span{color:var(--muted);font-size:.72rem}
.trophies{display:flex;flex-direction:column;gap:6px}
.trophy{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--panel);border-radius:12px;padding:10px 12px;font-size:.84rem;color:var(--muted)}
.trophy svg{width:30px;height:30px}
.trophy b{display:block;color:var(--chalk);font-size:.92rem;font-weight:500}
.trophy em{font-style:normal;font-variant-numeric:tabular-nums;font-size:.8rem}
.trophy.got{outline:1px solid rgba(245,197,24,.5)}
.trophy.got em{color:var(--line)}
.trophy .mbar{grid-column:2/-1;height:4px;background:#3a434f;border-radius:2px;overflow:hidden}
.trophy .mbar i{display:block;height:100%;background:var(--line)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days div{background:var(--panel);border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.days div b{color:var(--chalk);font-size:.85rem}
.days div svg{width:16px;height:16px}
.days div.past{opacity:.45}
.days div.today{background:var(--line);color:var(--ink)}
.days div.today b{color:var(--ink)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border-radius:12px;padding:12px 16px;font-size:.95rem}
.setrow input[type=range]{width:50%;accent-color:var(--line)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;line-height:1.45;color:var(--chalk)}
.steps li::marker{color:var(--line);font-weight:700}
.levelup{background:rgba(79,208,138,.14);color:var(--good);border-radius:12px;padding:10px 14px;font-weight:500}
.xpline{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted)}
.xpline i{display:block;height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.xpline i span{display:block;height:100%;background:var(--good)}
.vehs{display:flex;flex-direction:column;gap:8px}
.veh{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-align:left;background:var(--panel);border:2px solid transparent;border-radius:14px;padding:10px 12px;color:var(--muted);cursor:pointer;font:400 .8rem var(--body)}
.veh.eq{border-color:var(--line)}
.veh canvas{width:56px;height:84px}
.veh>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.veh .vt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.veh .vt b{font-family:var(--display);font-weight:400;font-size:1rem;color:var(--chalk)}
.veh .vt em{font-style:normal;color:var(--line);font-weight:700;white-space:nowrap}
.veh .stats{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-size:.7rem}
.veh .stats i{display:block;height:5px;background:#3a434f;border-radius:3px;overflow:hidden}
.veh .stats i span{display:block;height:100%;background:var(--good)}
.veh:disabled{opacity:.5;cursor:default}
.veh:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="game">
  <div class="hud">
    <div class="pill" id="pScore"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8z" fill="currentColor"/></svg><b id="hScore">0</b></div>
    <div class="pill" id="pTime"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M12 9v4l3 2M9 2h6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg><b id="hTime">0</b><small>s</small></div>
    <div class="spacer"></div>
    <button class="round" id="pause" type="button" aria-label="Pause"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
  </div>
  <div class="route"><span id="rFrom">0.0 km</span><div class="bar"><i id="rBar" style="width:0%"></i></div><span id="rTo">Best 0</span></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div class="coach" id="coach" hidden></div><div class="toast" id="toast" style="opacity:0"></div></div>
  <div class="controls">
    <button class="ctl" id="bLeft" type="button" aria-label="Steer left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="ctl stop" id="bStop" type="button" aria-label="Stop">Stop</button>
    <button class="ctl boost" id="bBoost" type="button" aria-label="Boost">Boost<i id="fuel"></i></button>
    <button class="ctl" id="bRight" type="button" aria-label="Steer right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4 8 8-8 8" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
</div>
<div class="overlay" id="overlay"></div>

<script>
const $=id=>document.getElementById(id);
const pick=a=>a[Math.random()*a.length|0];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COIN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#f5c518"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#b8860b" stroke-width="2"/></svg>';
const store={get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- Maps ---------- */

function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function seeded(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}
  return()=>{h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}

let MS=store.get('trr-missions',null);
function newMission(exclude){const tiers=store.get('trr-mtiers',{});
  // Missions never run out: after the listed goals, targets keep growing (except one-off missions)
  const keys=Object.keys(MISSIONS).filter(k=>!exclude.includes(k)&&!(k==='maps'&&(tiers[k]||0)>=1));
  if(!keys.length)return null;const k=pick(keys);
  return{k,tier:tiers[k]||0,prog:k==='maps'?store.get('trr-mapsplayed',[]).length:0}}
if(!Array.isArray(MS)||MS.length!==3||MS.some(m=>m&&!MISSIONS[m.k])){MS=[];for(let i=0;i<3;i++){const m=newMission(MS.map(x=>x.k));if(m)MS.push(m)}store.set('trr-missions',MS)}
function mScale(k,tier){const M=MISSIONS[k],n=M.ns.length;if(tier<n)return{n:M.ns[tier],r:M.reward[tier]};const x=tier-n+1;
  return{n:Math.round(M.ns[n-1]*Math.pow(1.5,x)),r:Math.round(M.reward[n-1]*Math.pow(1.25,x))}}
const mTarget=m=>mScale(m.k,m.tier).n,mReward=m=>mScale(m.k,m.tier).r,mText=m=>MISSIONS[m.k].text(mTarget(m));
// Called during play; finished missions pay out and are swapped for new ones
function missionTick(kind,val){
  let changed=false;
  MS.forEach((m,i)=>{if(!m||m.fresh)return;const before=m.prog;
    if(kind==='pax'&&m.k==='pax')m.prog+=val;
    if(kind==='fam'&&m.k==='fam')m.prog+=1;
    if(kind==='boost'&&m.k==='boost')m.prog+=val;
    if(kind==='run'&&MISSIONS[m.k].run)m.prog=Math.max(m.prog,val[m.k]||0);
    if(kind==='maps'&&m.k==='maps')m.prog=val;
    if(kind==='daily'&&m.k==='daily')m.prog+=1;
    if(kind==='close'&&m.k==='close')m.prog+=1;
    if(kind==='pu'&&m.k==='pu')m.prog+=1;
    if(m.prog!==before)changed=true;
    if(m.prog>=mTarget(m)){
      const r=earn(mReward(m));const tiers=store.get('trr-mtiers',{});tiers[m.k]=(tiers[m.k]||0)+1;store.set('trr-mtiers',tiers);
      if(G&&G.doneMissions)G.doneMissions.push({text:mText(m),reward:r});
      if(G&&G.mode==='play'){toast('Mission complete! +'+r+' coins');sfx('buy')}
      MS[i]=newMission(MS.filter((x,j)=>x&&j!==i).map(x=>x.k));if(MS[i])MS[i].fresh=true;changed=true}});
  MS=MS.filter(Boolean);while(MS.length<3){const m=newMission(MS.map(x=>x.k));if(!m)break;MS.push(m)}
  if(changed&&kind!=='boost')store.set('trr-missions',MS);
}
function missionsHTML(){
  return MS.map(m=>{const t=mTarget(m),p=Math.min(t,m.prog);
    return `<div class="mission"><span>${mText(m)}</span><span class="rw">${COIN}${mReward(m)}</span>
      <div class="mbar"><i style="width:${p/t*100}%"></i></div><small>${m.fresh?'Starts next run':(MISSIONS[m.k].run?'Best run: ':'')+Math.floor(p)+' / '+t}</small></div>`}).join('');
}

  if(SET.ctrl!=='tilt'||tiltG==null||g.freeze||g.stun)return;
  const rel=tiltG-tiltZero,T=SET.tiltSens;let to=g.lane;
  if(rel<-T)to=0;else if(rel>T)to=2;else if(Math.abs(rel)<T-3)to=1;

/* ---------- Spawning ---------- */
const TYPES=['pax','car','hole','cop','cow'];
function rollType(m){let r=Math.random(),acc=0;for(let i=0;i<5;i++){acc+=m[i];if(r<acc)return TYPES[i]}return 'pax'}
function spawnRows(){
  const g=G;if(g.kind==='tutorial')return;
  while(g.nextRow<g.dist+H*1.6){
    const y=g.nextRow,lanes=[0,1,2].sort(()=>Math.random()-.5),ek=g.event&&g.event.k,noCars=ek==='strike';
    addObj(rollType(EV_MIX[ek]||g.mix||g.M.mix),lanes[0],y);
    if(Math.random()<.2*g.L.dens)addObj(Math.random()<.5?'pax':noCars?'hole':pick(['car','hole']),lanes[1],y+40);
    if((ek==='strike'||ek==='crowd')&&Math.random()<.5)addObj('pax',lanes[2],y+80);
    if(g.L.dens>2&&Math.random()<.12)addObj('pax',lanes[2],y+80); // never wall off all three lanes
    else if(g.kind==='endless'&&Math.random()<.075)addObj('pu',lanes[2],y+110,{pk:pick(['shield','clock','double','magnet'])});

}
function addObj(type,lane,y,opts={}){
  const g=G,o={type,lane,y,x:null,hit:false,t:Math.random()*6,look:Math.random()*4|0};
  if(type==='pax'){const fc=g.event&&g.event.k==='crowd'?.7:(g.famChance||.3);o.family=opts.family!=null?opts.family:Math.random()<fc;o.pts=o.family?VEH[g.veh||'quantum'].fam:1}
  if(type==='car'){o.speed=opts.speed!=null?opts.speed:g.carSpd[0]+Math.random()*(g.carSpd[1]-g.carSpd[0]);
    o.color=pick(['#d94a3a','#3b7dd8','#8c5bd6','#2f9e62','#cfd3d8','#2a2f37']);
    // Traffic gets more aggressive the further you drive (see aggro)
    const ag=aggro(g);o.trig=null;
    if(opts.speed==null&&Math.random()<Math.min(.55,g.carChange+ag*.3)){o.trig=230+Math.random()*170-ag*60;o.cutIn=Math.random()<ag*.35;o.second=Math.random()<ag*.2}
    if(opts.speed==null&&Math.random()<ag*.22)o.brakeTrig=150+Math.random()*150;
    if(g.event&&g.event.k==='storm')o.speed*=.85}

/* ---------- Loop ---------- */
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(G.mode==='play'){update(dt);if(G.mode==='play')draw()}
  if(G.mode==='play')raf=requestAnimationFrame(loop);
}
function update(dt){
  const g=G,geo=roadGeo();
  g.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.life-=dt});g.parts=g.parts.filter(p=>p.life>0);
  // 3-2-1 countdown before the clock starts
  if(g.countdown>0){const before=Math.ceil(g.countdown);g.countdown-=dt;const after=Math.ceil(g.countdown);
    if(after!==before&&before<=4)sfx(after>0?'beep':'go');if(g.x==null)g.x=laneX(geo,g.lane);return}
  g.elapsed+=dt;
  g.freeze=Math.max(0,g.freeze-dt);g.stun=Math.max(0,g.stun-dt);g.slow=Math.max(0,g.slow-dt);g.shake=Math.max(0,g.shake-dt);g.seatFlash=Math.max(0,g.seatFlash-dt);
  if(g.kind==='endless'){g.comboT=Math.max(0,g.comboT-dt);if(!g.comboT)g.combo=0;g.dbl=Math.max(0,g.dbl-dt);g.mag=Math.max(0,g.mag-dt)}
  // Brake: hold Stop to slow down to a standstill
  g.brakeF+=((keys.brake?1:0)-g.brakeF)*Math.min(1,dt*(keys.brake?5:3));
  g.boosting=keys.boost&&!keys.brake&&g.fuel>0.02&&!g.freeze&&!g.stun;
  g.fuel=g.boosting?Math.max(0,g.fuel-dt*.38*(1-.18*UP.tank)):Math.min(1,g.fuel+dt*.12*(1+.35*UP.turbo));
  const V=VEH[g.veh]||VEH.quantum;
  eventTick(g,dt);tiltSteer(g);
  if(SET.ctrl==='tilt'&&!tiltOK&&g.elapsed>2&&!g.tiltWarned){g.tiltWarned=true;toast('Tilt isn\'t working here. Tap the sides of the road to steer')}
  let sp=(g.kind==='tutorial'?175:g.D.speed+Math.min(165,g.dist/320)*g.D.ramp)*V.speed;
  if(g.boosting)sp*=1.8;
  if(g.slow)sp*=.4;
  sp*=1-g.brakeF;
  if(g.freeze||g.stun)sp=0;
  g.spNow=sp;
  g.dist+=sp*dt;
  if(g.kind==='endless')g.L.dens=g.D.dens*(1+Math.min(1,g.dist/30000)*g.D.ramp);
  const tx=laneX(geo,g.lane);if(g.x==null)g.x=tx;g.tilt=(tx-g.x)/geo.lane;const wet=g.twist==='rain'||(g.event&&g.event.k==='storm');g.x+=(tx-g.x)*Math.min(1,dt*(wet?6:14)*V.steer);
  if(g.boosting&&g.kind==='endless')missionTick('boost',dt);

  spawnRows();
  const tw=geo.lane*.5*V.size,th=tw*V.len;
  for(const o of g.objs){
    o.t+=dt;
    const sy=geo.taxiY-(o.y-g.dist);
    if(o.type==='car')carAI(o,g,dt);
    if(o.type==='cow'){if(sy>-60){o.lf+=o.dir*o.cs*dt;if(o.lf>2.5||o.lf<-.5)o.dir*=-1}o.x=laneX(geo,o.lf)}
    else{const ox=laneX(geo,o.lane);o.x=o.x==null?ox:o.x+(ox-o.x)*Math.min(1,dt*(o.pulled?12:4))}
    if(o.hit)continue;
    // Magnet upgrade: passengers in the next lane run to the taxi
    if(UP.magnet&&o.type==='pax'&&!o.pulled&&Math.abs(o.lane-g.lane)===1&&sy<geo.taxiY&&sy>geo.taxiY-(90+UP.magnet*50)){o.lane=g.lane;o.pulled=true}
    // Magnet power-up: everyone ahead runs to your lane
    if(g.mag>0&&o.type==='pax'&&!o.pulled&&o.lane!==g.lane&&sy<geo.taxiY&&sy>geo.taxiY-260){o.lane=g.lane;o.pulled=true}
    const ow=o.type==='car'?geo.lane*.5:o.type==='cow'?geo.lane*.5:o.type==='pu'?geo.lane*.4:geo.lane*.45,oh=o.type==='car'?ow*1.75:ow*.9;
    // Close call: passing right next to a car without touching it
    if(o.type==='car'&&g.kind==='endless'&&!o.near&&!o.jam&&!g.stun&&!g.freeze&&Math.abs(sy-geo.taxiY)<th*.35){const dx=Math.abs(o.x-g.x);
      if(dx>(ow+tw)/2*.85&&dx<geo.lane*1.15){o.near=true;g.bonus+=1;ev('close');float('Close call! +1',g.x,geo.taxiY-50,'#47bff2');sfx('whoosh');buzz(12)}}
    if(Math.abs(o.x-g.x)<(ow+tw)/2*.85&&Math.abs(sy-geo.taxiY)<(oh+th)/2*.85){
      if((g.freeze||g.stun)&&o.type!=='pax')continue;
      o.hit=true;hitObj(o,sy);
    }
  }
  // Drop things behind the taxi, and cars that have driven far ahead out of sight
  g.objs=g.objs.filter(o=>!(o.hit&&o.type!=='hole')&&o.y>g.dist-H&&o.y<g.dist+H*4);
  g.texts.forEach(t=>t.life-=dt);g.texts=g.texts.filter(t=>t.life>0);
  $('hScore').textContent=g.score;$('fuel').style.width=(g.fuel*100)+'%';

  if(g.kind==='endless'){
    g.timeLeft-=dt;
    $('hTime').textContent=Math.max(0,Math.ceil(g.timeLeft));
    $('pTime').classList.toggle('hot',g.timeLeft<=8);
    $('pScore').classList.toggle('ok',g.best>0&&g.score>g.best);
    $('rFrom').textContent=(g.dist/1000).toFixed(1)+' km';
    $('rTo').textContent=g.score>g.best&&g.best>0?'New best!':'Best '+g.best;
    $('rBar').style.width=(g.best?Math.min(100,g.score/g.best*100):Math.min(100,g.score*4))+'%';
    g.run.km=g.dist/1000;

    if(g.timeLeft<=0)outOfTime();
  }else{
    $('hTime').textContent=Math.floor(g.elapsed);
    $('rBar').style.width=((g.tut.i+(g.tut.started?.5:0))/TUT.length*100)+'%';
    tutUpdate(g,dt);
  }
}

/* ---------- Road events: short surprises during a run ---------- */
const EVENTS={
  jam:   {name:'Traffic jam',  c:'#ff5d4d',dur:13,warn:'Traffic jam ahead! Find the open lane'},
  storm: {name:'Storm',        c:'#47bff2',dur:15,warn:'A storm is rolling in. The road is slippery'},
  strike:{name:'Taxi strike',  c:'#4fd08a',dur:14,warn:'Taxi strike! Empty roads and passengers everywhere'},
  crowd: {name:'Stadium crowd',c:'#f5c518',dur:12,warn:'The match just ended! Families everywhere'},
  works: {name:'Roadworks',    c:'#ff7a1a',dur:13,warn:'Roadworks ahead. Watch for roadblocks'}

const EV_MIX={strike:[.72,0,.18,.1,0],crowd:[.75,.1,.1,.05,0],works:[.45,.1,.17,.22,0]};
function eventTick(g,dt){
  if(g.kind!=='endless')return;
  if(!g.event&&g.elapsed>=g.nextEv){
    const keys=Object.keys(EVENTS).filter(k=>k!==g.lastEv),k=pick(keys);g.event={k,t:0};g.lastEv=k;
    toast(EVENTS[k].warn);sfx('alert');buzz(40);if(k==='jam')spawnJam(g)}
  if(g.event){g.event.t+=dt;if(g.event.t>=EVENTS[g.event.k].dur){
    g.bonus+=3;PROF.events=(PROF.events||0)+1;saveProf();float(EVENTS[g.event.k].name+' over! +3',g.x,roadGeo().taxiY-60,'#f5c518');
    g.event=null;g.nextEv=g.elapsed+40+Math.random()*25}}
}
// A traffic jam fills two lanes with stopped cars; the open lane has passengers waiting
function spawnJam(g){
  const free=pick([0,1,2]),y0=Math.max(g.nextRow,g.dist+H*1.1);
  for(let i=0;i<7;i++)[0,1,2].forEach(l=>{const y=y0+i*110;
    if(l===free){if(i%2===0)addObj('pax',l,y+40)}else{const c=addObj('car',l,y,{speed:12});c.braking=true;c.jam=true}});
  g.nextRow=y0+7*110+120;
}
function eventBanner(g){if(!g.event)return;const E=EVENTS[g.event.k],left=1-g.event.t/E.dur;
  ctx.font='700 13px Rubik, system-ui, sans-serif';const w=ctx.measureText(E.name).width+28,x=W/2-w/2,y=H-44;
  ctx.fillStyle='rgba(15,18,23,.82)';rr(x,y,w,26,13);ctx.fill();ctx.fillStyle=E.c;ctx.textAlign='center';ctx.fillText(E.name,W/2,y+17);
  ctx.fillRect(x+10,y+21,(w-20)*left,2)}

// How pushy the traffic is: 0 at the start, rising slowly with distance, capped so it never gets unfair
function aggro(g){if(!g||g.kind!=='endless')return 0;return Math.min(1,g.dist/32000)*({easy:.55,normal:.8,hard:1}[g.diff]||.8)}
function laneOK(o,to,g){
  if(to<0||to>2)return false;
  for(const c of g.objs){if(c===o||c.type!=='car'||c.hit)continue;
    if((c.lane===to||(c.signal>0&&c.to===to))&&Math.abs(c.y-o.y)<150)return false}
  if(to===g.lane){const ahead=o.y-g.dist;if(ahead<180||(g.spNow||0)<90||g.freeze||g.stun)return false}
  return true}
function carAI(o,g,dt){
  const ahead=o.y-g.dist;
  // Sudden braking, with brake lights
  if(o.brakeTrig&&!o.braking&&ahead<o.brakeTrig&&ahead>0){o.braking=true}
  if(o.braking)o.speed=Math.max(20,o.speed-160*dt);
  o.y+=o.speed*dt;
  // Lane changes always flash the indicator first, so you get a fair warning
  if(o.trig!=null&&o.signal==null&&ahead<o.trig&&ahead>40){
    let to=o.lane===1?pick([0,2]):1;
    if(o.cutIn&&g.lane!==o.lane)to=o.lane+Math.sign(g.lane-o.lane);
    if(!laneOK(o,to,g)){o.trig=null;return}
    o.to=to;o.signal=Math.max(.5,.8-aggro(g)*.25)}
  if(o.signal!=null&&o.signal>0){o.signal-=dt;if(o.signal<=0&&!laneOK(o,o.to,g)){o.signal=null;o.trig=null;return}if(o.signal<=0){o.lane=o.to;o.signal=null;o.trig=null;
    if(o.second){o.second=false;o.trig=Math.max(60,ahead-140)}}}
}
function aggroNews(g){if(g.kind!=='endless')return;const a=aggro(g),steps=[[.3,'Traffic is picking up'],[.6,'Drivers are getting impatient. Watch the indicators'],[.9,'Rush hour madness!']];
  g.agStep=g.agStep||0;if(g.agStep<steps.length&&a>=steps[g.agStep][0]){toast(steps[g.agStep][1]);g.agStep++}}
function burst(x,y,colors,n,spd=160){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=spd*(.4+Math.random()*.8);
  G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*.6,life:.5+Math.random()*.4,c:pick(colors),s:2+Math.random()*3})}}
const PU={shield:{name:'Shield',c:'#47bff2',desc:'Blocks the next crash, pothole, roadblock or cow'},clock:{name:'Clock',c:'#f5c518',desc:'+5 seconds on the clock'},
  double:{name:'Double fares',c:'#4fd08a',desc:'Every passenger counts twice for 10 seconds'},magnet:{name:'Magnet',c:'#ff5d4d',desc:'Passengers in every lane run to you for 8 seconds'}};
function hitObj(o,sy){
  const g=G;

function lerpC(a,b,t){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
const hash=k=>(((k*2654435761)>>>0)%1000)/1000;
function shadow(x,y,w,h){ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(x,y,w,h,0,0,7);ctx.fill()}
function phase(g){if(g.twist==='night')return 1;if(g.kind!=='endless')return 0;const p=(g.dist/14000)%2;return p<1?p:2-p}

// Draws the road scene for a map. Used by the game and the menu previews.
function scene(g,geo){
  const M=g.M,prog=phase(g);
  NIGHT=Math.max(0,(prog-.55)/.45);
  const grass=prog<.5?lerpC(M.grass[0],M.grass[1],prog*2):lerpC(M.grass[1],M.grass[2],(prog-.5)*2);
  ctx.fillStyle=grass;ctx.fillRect(-10,-10,W+20,H+20);
  ctx.fillStyle='rgba(0,0,0,.06)';
  for(let k=Math.floor((g.dist-H)/40);k<Math.ceil((g.dist+H)/40);k++){const sy=geo.taxiY-(k*40-g.dist);
    ctx.fillRect(hash(k*3+1)*W,sy,3,3);ctx.fillRect(hash(k*5)*W,sy+20,2,2)}
  // Sea on the coast map
  if(M.sea){const sx=geo.left+geo.rw+16;ctx.fillStyle=lerpC('#e6cf96','#c9a874',prog);ctx.fillRect(geo.left+geo.rw+6,-10,12,H+20);
    ctx.fillStyle=prog<.5?lerpC('#2d8fd0','#3a6f9e',prog*2):lerpC('#3a6f9e','#16233a',(prog-.5)*2);ctx.fillRect(sx,-10,W-sx+10,H+20);
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;
    for(let k=Math.floor((g.dist-H)/60);k<Math.ceil((g.dist+H)/60);k++){const sy=geo.taxiY-(k*60-g.dist),wx=sx+10+hash(k)*(W-sx-30);
      ctx.beginPath();ctx.moveTo(wx,sy);ctx.quadraticCurveTo(wx+6,sy-4,wx+12,sy);ctx.quadraticCurveTo(wx+18,sy+4,wx+24,sy);ctx.stroke()}
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.moveTo(sx,-10);ctx.lineTo(sx,H+10);ctx.stroke()}
  // Road and kerbs
  ctx.fillStyle=M.road;ctx.fillRect(geo.left,-10,geo.rw,H+20);
  const kb=26;
  for(let k=Math.floor((g.dist-H)/kb);k<=Math.ceil((g.dist+H)/kb);k++){const y=geo.taxiY-(k*kb-g.dist);if(y<-kb||y>H)continue;
    ctx.fillStyle=M.kerb[((k%2)+2)%2];ctx.fillRect(geo.left-6,y,6,kb);ctx.fillRect(geo.left+geo.rw,y,6,kb)}
  for(let k=Math.floor((g.dist-H)/170);k<Math.ceil((g.dist+H)/170);k++){const h=hash(k*7+2);if(h>.45)continue;
    const sy=geo.taxiY-(k*170-g.dist);ctx.fillStyle='rgba(0,0,0,.08)';ctx.beginPath();ctx.ellipse(geo.left+20+hash(k*11)*(geo.rw-40),sy,18+h*30,6+h*8,0,0,7);ctx.fill()}
  ctx.fillStyle='rgba(255,255,255,.8)';
  const dash=64,off=((g.dist%dash)+dash)%dash;
  for(let l=1;l<3;l++){const x=geo.left+geo.lane*l-2;for(let y=-dash+off;y<H+dash;y+=dash)ctx.fillRect(x,y,4,32)}
  // Roadside scenery
  if(geo.left>=34){const step=120;
    for(let k=Math.floor((g.dist-H*.3)/step);k<=Math.ceil((g.dist+H)/step);k++){
      const h=hash(k+7),sy=geo.taxiY-(k*step-g.dist),side=h<.5?-1:1,space=Math.max(0,geo.left-46);
      if(M.sea&&side>0)continue;
      const vx=side<0?geo.left-24-hash(k)*space:geo.left+geo.rw+24+hash(k)*space;
      SCEN[M.scen[Math.floor(hash(k*13+5)*M.scen.length)]](vx,sy,hash(k+3))}}
}

  if(g.shield){const tw=geo.lane*.5;ctx.strokeStyle='rgba(71,191,242,.85)';ctx.fillStyle='rgba(71,191,242,.12)';ctx.lineWidth=3;

    ctx.globalCompositeOperation='source-over'}
  for(const p of g.parts){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}
  ctx.globalAlpha=1;ctx.textAlign='center';ctx.font='700 17px Rubik, system-ui, sans-serif';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.55)';
  for(const t of g.texts){ctx.globalAlpha=Math.min(1,t.life*1.6);ctx.fillStyle=t.c;const y=t.y-(1-t.life)*42;ctx.strokeText(t.txt,t.x,y);ctx.fillText(t.txt,t.x,y)}
  ctx.globalAlpha=1;
  activeHud(g);eventBanner(g);
  if(g.countdown>0){const n=Math.ceil(g.countdown),f=g.countdown-Math.floor(g.countdown);
    ctx.fillStyle='rgba(15,18,23,.35)';ctx.fillRect(-10,-10,W+20,H+20);
    if(n<=3){ctx.font=`${60+f*40}px Bungee, Impact, sans-serif`;ctx.fillStyle='#f5c518';ctx.strokeStyle='rgba(0,0,0,.5)';ctx.lineWidth=6;
      ctx.strokeText(String(n),W/2,H*.42);ctx.fillText(String(n),W/2,H*.42)}
    if(SET.ctrl!=='buttons'){ctx.font='700 15px Rubik, system-ui, sans-serif';ctx.fillStyle='#f1f3f6';ctx.textAlign='center';
      if(SET.ctrl==='tap'){ctx.fillText('◀ Tap',W*.18,H*.62);ctx.fillText('Tap ▶',W*.82,H*.62)}

  ctx.restore();
}

/* ---------- Sound (Web Audio) ---------- */
let AC=null,master=null,noiseBuf=null,soundOn=store.get('trr-sound',true);
let sfxBus=null;
function ac(){if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=soundOn?.8:0;master.connect(AC.destination);
  sfxBus=AC.createGain();sfxBus.gain.value=SET.sfx;sfxBus.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  if(AC.state==='suspended')AC.resume();return AC}
function tone(f,t,dur,type='sine',vol=.1,slide=null,dest){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(dest||sfxBus||master);o.start(t);o.stop(t+dur+.02)}
function noise(t,dur,vol,hp=6000,dest){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(dest||sfxBus||master);s.start(t);s.stop(t+dur)}
// Each map has its own groove: tempo, key, chord moves and lead sound
const STYLES={
  township:{bpm:112,root:55,minor:true, prog:[0,-2,3,-4],lead:'triangle',seed:'tw'},
  city:    {bpm:120,root:49,minor:true, prog:[0,3,-2,5], lead:'square',  seed:'ct'},
  coast:   {bpm:102,root:58,minor:false,prog:[0,5,-3,-5],lead:'sine',    seed:'cs'},
  bush:    {bpm:108,root:52,minor:true, prog:[0,-5,-2,-4],lead:'triangle',seed:'bs',shaker:true}
};
const music={bus:null,timer:0,step:0,next:0,on:false,style:'township',mel:{},
  melody(st){if(this.mel[st.seed])return this.mel[st.seed];const r=seeded(st.seed),sc=st.minor?[0,3,5,7,10,12,15]:[0,2,4,7,9,12,14];
    const bars=[];for(let b=0;b<4;b++){const bar=[];for(let s=0;s<16;s++)bar.push(r()<(s%4===0?.55:.28)?sc[Math.floor(r()*sc.length)]:null);bars.push(bar)}
    return this.mel[st.seed]=bars},
  start(){try{ac();if(!this.bus){this.bus=AC.createGain();this.bus.gain.value=.7*SET.music;this.bus.connect(master)}
    if(this.on)return;this.on=true;this.step=0;this.next=AC.currentTime+.05;this.timer=setInterval(()=>this.tick(),25)}catch(e){}},
  stop(){this.on=false;clearInterval(this.timer)},
  tick(){const st=STYLES[this.style]||STYLES.township,spb=60/st.bpm/4,mel=this.melody(st),N=f=>st.root*Math.pow(2,f/12);
    // 16 bars: groove, groove + lead, groove + lead, breakdown
    while(this.next<AC.currentTime+.12){const t=this.next,b=this.bus,s=this.step%16,bar=Math.floor(this.step/16)%16,sec=Math.floor(bar/4),root=st.prog[bar%4];
      const tri=st.minor?[0,3,7]:[0,4,7];
      if(sec!==3&&s%4===0)tone(60,t,.22,'sine',.35,38,b);
      if(sec!==3&&s%8===4)noise(t,.12,.12,1500,b);
      noise(t,.04,(sec===3?.4:1)*(s%2?.03:.05),7000,b);
      if(st.shaker&&s%2===1)noise(t,.06,.03,4000,b);
      if(sec!==3&&[0,3,6,10,12].includes(s)){const f=N(root+(s===10?7:0));tone(f*2,t,.32,'sine',.28,f*1.44,b)}
      if(sec===3&&s===0)tri.forEach(i=>tone(N(root+i)*4,t,spb*15,'triangle',.03,null,b));
      else if(s===2||s===10)tri.forEach(i=>tone(N(root+i)*4,t,.18,'triangle',.035,null,b));
      if(sec===1||sec===2){const n=mel[bar%4][s];if(n!=null)tone(N(root+n)*8,t,.16,st.lead,st.lead==='square'?.025:.05,null,b)}
      this.step++;this.next+=spb}}};
function applyVolumes(){if(!AC)return;sfxBus.gain.value=SET.sfx;if(music.bus)music.bus.gain.value=.7*SET.music}
function sfx(k,p){try{ac();const t=AC.currentTime;
  if(k==='alert'){tone(880,t,.12,'square',.05);tone(660,t+.14,.12,'square',.05);tone(880,t+.28,.12,'square',.05)}
  if(k==='pu'){[523,659,784,1046,1318].forEach((f,i)=>tone(f,t+i*.045,.12,'square',.04))}
  if(k==='shield'){tone(300,t,.3,'sine',.2,900);noise(t,.2,.08,2000)}
  if(k==='whoosh'){noise(t,.22,.12,2500);tone(500,t,.2,'sine',.03,250)}
  if(k==='combo'){const f=520*Math.pow(2,Math.min(p||3,14)/12);tone(f,t,.09,'triangle',.1);tone(f*1.5,t+.06,.1,'triangle',.08)}
  if(k==='level'){[392,523,659,784,1046].forEach((f,i)=>tone(f,t+i*.09,.25,'triangle',.12))}
  if(k==='pickup'){tone(880,t,.1,'triangle',.14);tone(1320,t+.07,.12,'triangle',.12)}
  if(k==='family'){[660,880,1100,1320].forEach((f,i)=>tone(f,t+i*.06,.14,'triangle',.12))}
  if(k==='hole'){tone(120,t,.25,'sine',.4,50);noise(t,.15,.2,400)}
  if(k==='whistle'){for(let i=0;i<3;i++)tone(2400,t+i*.09,.07,'sine',.08,2600)}
  if(k==='moo'){tone(180,t,.7,'sawtooth',.07,120);tone(90,t,.7,'sine',.15,70)}
  if(k==='crash'){noise(t,.5,.4,200);tone(90,t,.4,'sawtooth',.15,40)}
  if(k==='hoot'){[0,.17].forEach((d,i)=>{tone(349,t+d,i?.24:.13,'square',.05);tone(440,t+d,i?.24:.13,'square',.04);tone(175,t+d,i?.24:.13,'sawtooth',.03)})}
  if(k==='brake'){noise(t,.25,.08,3000);tone(1800,t,.25,'sine',.03,1400)}
  if(k==='beep')tone(660,t,.15,'square',.07);
  if(k==='go'){tone(990,t,.3,'square',.08);tone(392,t+.05,.14,'square',.05);tone(392,t+.23,.2,'square',.05)}
  if(k==='buy'){[523,784,1046].forEach((f,i)=>tone(f,t+i*.07,.14,'triangle',.12))}
  if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,t+i*.1,.2,'triangle',.12))}
  if(k==='lose'){tone(196,t,.3,'sawtooth',.06);tone(147,t+.25,.45,'sawtooth',.06)}}catch(e){}}

/* ---------- Controls ---------- */
const playing=()=>G&&G.mode==='play'&&!(G.countdown>0);
function move(d){if(!playing()||G.freeze||G.stun)return;const n=Math.max(0,Math.min(2,G.lane+d));
  if(n!==G.lane&&G.tut)G.tut.moves=(G.tut.moves||0)+1;G.lane=n}
function boostDown(){if(!keys.boost&&playing())sfx('hoot');keys.boost=true;$('bBoost').classList.add('on')}
function boostUp(){keys.boost=false;$('bBoost').classList.remove('on')}
function brakeDown(){if(!keys.brake&&playing())sfx('brake');keys.brake=true;$('bStop').classList.add('on')}
function brakeUp(){keys.brake=false;$('bStop').classList.remove('on')}
addEventListener('keydown',e=>{
  if(e.code==='Escape'||e.code==='KeyP'){pauseGame();return}
  if(!$('overlay').hidden)return;
  if(e.repeat&&!['ArrowUp','KeyW','Space','ArrowDown','KeyS'].includes(e.code))return;
  if(['ArrowLeft','KeyA'].includes(e.code)){move(-1);e.preventDefault()}
  if(['ArrowRight','KeyD'].includes(e.code)){move(1);e.preventDefault()}
  if(['ArrowUp','KeyW','Space'].includes(e.code)){boostDown();e.preventDefault()}
  if(['ArrowDown','KeyS'].includes(e.code)){brakeDown();e.preventDefault()}});
addEventListener('keyup',e=>{if(['ArrowUp','KeyW','Space'].includes(e.code))boostUp();if(['ArrowDown','KeyS'].includes(e.code))brakeUp()});
$('bLeft').addEventListener('pointerdown',e=>{e.preventDefault();move(-1)});
$('bRight').addEventListener('pointerdown',e=>{e.preventDefault();move(1)});
$('bBoost').addEventListener('pointerdown',e=>{e.preventDefault();boostDown()});
$('bStop').addEventListener('pointerdown',e=>{e.preventDefault();brakeDown()});
['pointerup','pointerleave','pointercancel'].forEach(ev=>{$('bBoost').addEventListener(ev,boostUp);$('bStop').addEventListener(ev,brakeUp)});
let sx=null;cv.addEventListener('pointerdown',e=>{sx=e.clientX});
cv.addEventListener('pointerup',e=>{if(sx==null)return;if(SET.ctrl==='tilt'&&tiltOK){sx=null;return}const dx=e.clientX-sx;if(Math.abs(dx)>30)move(dx>0?1:-1);else move(e.offsetX<W/2?-1:1);sx=null});
function pauseGame(){
  if(!G||G.mode!=='play')return;G.mode='paused';cancelAnimationFrame(raf);music.stop();boostUp();brakeUp();pauseMenu();
}
function pauseMenu(){
  const lose=G.kind==='endless'?`Your current run (${G.score} passengers) will be lost and won't count for high scores or coins.`:'Your tutorial progress will be lost.';
  showOverlay(`<h2>Paused</h2><div class="stack">
    <button class="btn" id="resume" type="button">Resume</button>
    <button class="btn alt" id="restart" type="button">Restart</button>
    <button class="toggle" id="snd" type="button">Sound <em>${soundOn?'On':'Off'}</em></button>
    <button class="btn alt" id="quit" type="button">Quit to menu</button></div>`,true);
  $('resume').onclick=()=>{G.mode='play';run()};
  $('restart').onclick=()=>confirmBox({title:'Restart this drive?',text:lose,yes:'Yes, restart',no:'Keep driving',danger:true,dim:true,
    onYes:()=>{G.kind!=='endless'?startTutorial():G.daily?startDaily():startEndless(G.map,G.diff)},onNo:pauseMenu});
  $('snd').onclick=()=>{soundOn=!soundOn;store.set('trr-sound',soundOn);try{ac();master.gain.value=soundOn?.8:0}catch(e){}$('snd').querySelector('em').textContent=soundOn?'On':'Off'};
  $('quit').onclick=()=>confirmBox({title:'Quit to the menu?',text:lose,yes:'Yes, quit',no:'Keep driving',danger:true,dim:true,
    onYes:()=>{G.mode='end';coach(null);title()},onNo:pauseMenu});
}
$('pause').onclick=pauseGame;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});

function showOverlay(html,dim){const o=$('overlay');o.classList.toggle('dim',!!dim);o.innerHTML=`<div class="card">${html}</div>`;o.hidden=false;o.scrollTop=0;
  const b=o.querySelector('.btn');if(b)b.focus({preventScroll:true})}

const coinTag=()=>`<span class="coins">${COIN}${coins}</span>`;
const earnedTag=n=>`<div class="earned">${COIN}+${n} coins</div>`;
const wake=f=>(...a)=>{try{ac()}catch(e){}f(...a)};

// In-page "Are you sure?" screen. onNo returns to the previous screen.
function confirmBox({eyebrow='Are you sure?',title,text,extra='',yes,no='Cancel',danger=false,onYes,onNo,dim=false}){
  showOverlay(`<p class="eyebrow">${eyebrow}</p><h2>${title}</h2>${text?`<p>${text}</p>`:''}${extra}
    <div class="stack"><button class="btn${danger?' danger':''}" id="cYes" type="button">${yes}</button><button class="btn alt" id="cNo" type="button">${no}</button></div>`,dim);
  $('cYes').onclick=onYes;$('cNo').onclick=onNo;$('cNo').focus({preventScroll:true});
}

// Draws a still road scene for a map onto a small canvas
function preview(c,map,opts={}){const r=c.getBoundingClientRect();if(!r.width)return;c.width=r.width*2;c.height=r.height*2;
  const sw=W,sh=H;
  ctxSwap(c.getContext('2d'),()=>{ctx.scale(2,2);W=r.width;H=r.height;const geo=roadGeo(),g={dist:opts.dist||300,M:MAPS[map],kind:'menu'};
    scene(g,geo);
    if(opts.people){pax(laneX(geo,0),H*.32,{t:1.3,look:1,family:false});pax(laneX(geo,2),H*.18,{t:2,look:2,family:true})}
    if(map==='bush')cow(laneX(geo,2),H*.4,{t:0,dir:-1});
    if(map==='coast')sand(laneX(geo,0),H*.25,geo.lane*.48);
    if(map==='city')car(laneX(geo,2),H*.3,geo.lane*.5,'#3b7dd8');
    if(map==='township'&&!opts.people)hole(laneX(geo,0),H*.3,geo.lane*.48);
    taxi(laneX(geo,1),H*.66,geo.lane*.5,{score:6,skin:skinNow})});
  W=sw;H=sh}

function boardHTML(map,meId){
  const t=topFor(map);
  if(!t.length)return `<div class="empty">No scores on ${MAPS[map].name} yet. Be the first.</div>`;
  return `<ol class="board">${t.map((s,i)=>`<li class="${s.id===meId?'me':''}"><span class="r">${i+1}</span><span class="n">${esc(s.name)}<small>${DIFFS[s.diff]?DIFFS[s.diff].name:''} · ${s.date||''}</small></span><span class="k">${s.km.toFixed(1)} km</span><span class="s">${s.score}</span></li>`).join('')}</ol>`;
}
let hsView=null,hsPeriod='week';
function onlineRows(list){
  if(list===null)return `<div class="empty">Online scores need you to be signed in to Claude. Tap This device to see scores saved here.</div>`;
  if(list==='loading')return `<div class="empty">Loading online scores…</div>`;
  if(list==='error')return `<div class="empty">Couldn't load online scores. Check your internet connection and try again.${onlineErr?`<br><small>(${esc(onlineErr)})</small>`:''}</div>`;
  if(!list.length)return `<div class="empty">${hsPeriod==='week'&&USE_SB?'No scores this week yet. Yours could be the first.':'No online scores yet. Yours could be the first.'}</div>`;
  return `<ol class="board">${list.map((s,i)=>`<li class="${s.me?'me':''}"><span class="r">${i+1}</span><span class="n">${esc(s.name||'Driver')}${s.me?' (you)':''}<small>${DIFFS[s.diff]?DIFFS[s.diff].name:''} · ${esc(s.date||'')}</small></span><span class="k">${Number(s.km||0).toFixed(1)} km</span><span class="s">${Number(s.score)||0}</span></li>`).join('')}</ol>`;
}

function stopRun(){const g=G;g.mode='end';cancelAnimationFrame(raf);music.stop();boostUp();brakeUp();coach(null);draw();store.set('trr-played',true);return g}
function endEndless(){
  const g=stopRun();store.set('trr-lastmap',g.map);
  const km=g.dist/1000,isDaily=!!g.daily;
  missionTick('run',{...g.run,km});store.set('trr-missions',MS);
  PROF.runs++;PROF.km+=km;PROF.bestRun=Math.max(PROF.bestRun,g.score);PROF.bestKm=Math.max(PROF.bestKm,km);
  if(g.diff==='hard')PROF.hardSurvive=Math.max(PROF.hardSurvive,g.elapsed);saveProf();
  weeklyTick('km',km);weeklyTick('runs',1);
  let dailyNote='';
  if(isDaily){const ds=dailyState();const hit=g.score>=g.daily.target;
    if(hit&&!ds.rewarded){ds.rewarded=true;ev('daily');dailyNote=`Daily target beaten! <b>+${earn(50)} bonus coins</b>`}
    else if(hit)dailyNote='Daily target beaten again.';else dailyNote=`Daily target was ${g.daily.target}. Try again any time today.`;
    ds.best=Math.max(ds.best,g.score);store.set('trr-daily',ds)}
  const isBest=g.score>g.best,onBoard=!isDaily&&qualifies(g.map,g.score);
  sfx(isBest||onBoard?'win':'lose');
  const got=earn(g.score+Math.floor(km)+g.bonus+(isBest&&!isDaily?10:0));
  const xp=Math.round(g.score*5+km*15+g.run.combo*3);const ups=addXP(xp);checkAch();
  if(ups.length)sfx('level');const lvNow=levelInfo();
  const xpHTML=`<div class="xpline"><span>+${xp} XP · Level ${lvNow.l} ${lvNow.title} · ${lvNow.into} / ${lvNow.need}</span><i><span style="width:${lvNow.into/lvNow.need*100}%"></span></i></div>`+
    ups.map(u=>`<div class="levelup">Level up! You're now level ${u.l}. +${u.reward} coins</div>`).join('');
  const entry={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),name:'',score:g.score,km:Math.round(km*10)/10,map:g.map,diff:g.diff,
    date:new Date().toLocaleDateString(undefined,{day:'numeric',month:'short'})};
  const rank=topFor(g.map).filter(s=>sortS(s,entry)<0).length+1;
  const label=isDaily?`Daily challenge · ${TWISTS[g.twist].name}`:`${MAPS[g.map].name} · ${g.D.name}`;
  const doneHTML=g.doneMissions.length?`<div class="done-list">${g.doneMissions.map(m=>`<div><span>${m.text}</span><b>+${m.reward}</b></div>`).join('')}</div>`:'';
  const res={g,got,label,doneHTML,dailyNote,xpHTML,online:isDaily?'daily':onlineOn()?'waiting':'off'};
  const after=()=>resultScreen(res,null);
  // Score posts online automatically (except daily runs) with the player's saved name
  const post=name=>{if(isDaily||!onlineOn())return Promise.resolve();entry.name=name;res.online='posting';
    return submitOnline(g.map,entry).then(r=>{res.online=r;const el=$('onl');if(el)el.textContent=onlineMsg(r)})};
  const show=()=>{
  showOverlay(`<p class="eyebrow">${label}</p><h2>${isBest?'New best!':onBoard?'You made the top 10!':'Time\'s up'}</h2>
    <div class="result"><div><b>${g.score}</b><span>passengers</span></div><div><b>${km.toFixed(1)} km</b><span>distance</span></div><div><b>${Math.max(g.score,g.best)}</b><span>${isDaily?'today\'s best':'best on '+g.D.name}</span></div></div>
    ${earnedTag(got)}${xpHTML}${dailyNote?`<p>${dailyNote}</p>`:''}${doneHTML}<p class="note" id="onl">${onlineMsg(res.online)}</p>
    ${onBoard?`<p>That's <b>#${rank}</b> on the ${MAPS[g.map].name} high scores. Enter your name to save it.</p>
      <form class="nameform" id="nf"><input id="pname" maxlength="12" autocomplete="off" placeholder="Your name" aria-label="Your name" value="${esc(store.get('trr-name',''))}"><button class="btn" type="submit">Save</button></form>
      <p class="note" id="nerr" role="alert"></p>
      <button class="link" id="skip" type="button">Don't save</button>`:''}
    ${onBoard?'':resultButtons(isDaily)}`);
  if(onBoard){
    const inp=$('pname');setTimeout(()=>{try{inp.focus();inp.select()}catch(e){}},50);
    $('nf').addEventListener('submit',e=>{e.preventDefault();const name=(inp.value.trim()||'Driver').slice(0,12);
      if(badName(name)){$('nerr').textContent=NAME_ERR;inp.focus();return}store.set('trr-name',name);
      entry.name=name;saveScore(entry);sfx('buy');
      // Wait briefly for the online post, then show the shared list so the new score is on it
      const show2=()=>highScores(g.map,entry.id,()=>resultScreen(res,entry.id),onlineOn()?'online':'device');
      if(!onlineOn()||isDaily){post(name);show2();return}
      if(USE_SB)hsPeriod='week';Promise.race([post(name),new Promise(r=>setTimeout(r,3000))]).then(show2)});
    $('skip').onclick=()=>confirmBox({title:'Skip saving your score?',text:`Your score of ${g.score} won't appear on the ${MAPS[g.map].name} high scores, here or online. You'll still keep your coins.`,
      yes:'Yes, skip it',no:'Go back and save',danger:true,onYes:after,onNo:show});
  }else{post(playerName());wireResult(res)}
  };
  show();
}

function wireResult(res,meId){const g=res.g;

function onlineMsg(r){r=r||'';
  if(r==='daily')return 'Daily challenge scores aren\'t posted to the online high scores.';
  if(r==='off')return 'Online high scores aren\'t available here. Your score is saved on this device.';
  if(r==='waiting')return 'Save your name to post this score online.';
  if(r==='posting')return 'Posting your score online…';
  if(r==='saved')return 'Score posted to the online high scores ✓';
  if(r==='kept')return 'Your online best on this map is already higher, so it stays.';
  if(r==='weekly')return 'New best for this week posted to the online high scores ✓';
  if(r==='too_fast')return 'Score not posted: please wait a few seconds between runs.';
  if(r==='rejected')return 'This score couldn\'t be posted online.';
  if(r==='zero')return 'Runs with no passengers aren\'t posted online.';
  if(r.startsWith('error'))return 'Couldn\'t post your score online. Check your internet connection. ('+r.slice(6)+')';
  return 'Online: '+r}

    scene({dist:g.dist,M:MAPS[g.map],kind:'menu'},geo);
    ctx.save();ctx.scale(2.2,2.2);const sx=v=>v/2.2;
    pax(sx(laneX(geo,0)),sx(H*.3),{t:1.3,look:1,family:false});pax(sx(laneX(geo,2)),sx(H*.16),{t:2,look:2,family:true});
    taxi(sx(laneX(geo,1)),sx(H*.64),sx(geo.lane*.5),{score:g.score,skin:g.skin,veh:g.veh});ctx.restore();
    ctx.fillStyle='#1b2028';ctx.fillRect(0,780,1080,570);ctx.fillStyle='#f5c518';ctx.fillRect(0,776,1080,8);

    ctx.fillStyle='#f1f3f6';ctx.font='190px Bungee, Impact, sans-serif';ctx.fillText(String(g.score),540,1075);
    ctx.fillStyle='#9aa6b4';ctx.font='500 42px Rubik, system-ui, sans-serif';
    ctx.fillText(`passengers · ${MAPS[g.map].name} · ${(g.dist/1000).toFixed(1)} km · ${g.D.name}`,540,1140);
    ctx.fillStyle='#f5c518';ctx.font='54px Bungee, Impact, sans-serif';ctx.fillText('CAN YOU BEAT ME?',540,1235);
    ctx.fillStyle='#9aa6b4';ctx.font='500 34px Rubik, system-ui, sans-serif';ctx.fillText(SHARE_URL.replace('https://',''),540,1300)});
  W=sw;H=sh;
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)return null;

async function shareScore(res){
  const g=res.g,text=shareText(g),msg=t=>{const el=$('shareMsg');if(el)el.textContent=t},file=res.cardFile;
  try{
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});msg('Thanks for sharing!');return}

  showOverlay(`<p class="eyebrow">Tutorial complete</p><h2>You're ready to drive</h2>

    <div class="stack"><button class="btn" id="go" type="button">Choose a map</button><button class="btn alt" id="home" type="button">Menu</button></div>`);
  $('go').onclick=chooseMap;$('home').onclick=title;
}

applyControls();resize();(()=>{const r=checkLogin();r?loginScreen(r):title()})();
</script>
